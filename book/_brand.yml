# Colours only. Fonts are set per format (theme-*.scss for HTML, typst-style.typ
# for the PDF) because Typst can only use fonts installed on the machine.
color:
  palette:
    pool-a: "#1f5f8b"
    pool-b: "#d98e04"
    ink: "#14202b"
    paper: "#fbfbf9"
  foreground: ink
  background: paper
  primary: pool-a
  secondary: pool-b
