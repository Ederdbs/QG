project:
  type: book
  # Output goes to docs/ at the repository root: that is the directory GitHub
  # Pages can serve straight from the main branch, with no CI and no second
  # branch to keep in sync.
  output-dir: ../docs
  resources:
    - .nojekyll

book:
  title: "Genetic Diversity in Hybrid Breeding"
  subtitle: "Measuring it, constraining it, and optimising against it, with R"
  author: "Eder D. B. S."
  date: today
  search: true
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - 01-coancestry.qmd
        - 02-subdivided.qmd
    - part: "Simulation"
      chapters:
        - 03-simulating-crosses.qmd
        - 04-population-sizing.qmd
    - part: "Metrics"
      chapters:
        - 05-genomic-era.qmd
        - 06-metric-catalogue.qmd
        - 07-choosing-metrics.qmd
        - 08-pipeline-stages.qmd
    - part: "Optimisation"
      chapters:
        - 09-optimal-contributions.qmd
        - 10-combinatorial-selection.qmd
    - part: "Evidence and practice"
      chapters:
        - 11-plant-literature.qmd
        - 12-case-study.qmd
  appendices:
    - 90-notation.qmd
    - 91-package.qmd
    - 92-verification.qmd
    - 93-corpora.qmd
    - 99-references.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    code-link: false
    code-overflow: scroll
    fig-width: 7
    fig-height: 4.5
    fig-dpi: 150
    df-print: kable
    citations-hover: true
    link-external-newwindow: true
  # Typst, not `pdf:`. Quarto bundles the Typst compiler, so this needs no
  # LaTeX install; a `pdf:` block would require `quarto install tinytex`.
  typst:
    toc: true
    toc-depth: 3
    number-sections: true
    papersize: a4
    fig-width: 6.5
    fig-height: 4
    df-print: kable

execute:
  freeze: auto
  warning: false
  message: false
  echo: true

knitr:
  opts_chunk:
    comment: "#>"
    collapse: true
    fig.align: center
